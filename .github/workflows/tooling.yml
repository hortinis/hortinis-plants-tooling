name: Tooling checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.26.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:fixtures

  catalog:
    if: vars.HORTINIS_INTEGRATION_DATA_REF != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HORTINIS_DATA_ROOT: ${{ github.workspace }}/catalog
    defaults:
      run:
        working-directory: tooling
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: hortinis/hortinis-plants
          ref: ${{ vars.HORTINIS_INTEGRATION_DATA_REF }}
          path: catalog
          token: ${{ secrets.HORTINIS_CATALOG_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: tooling/.node-version
      - run: npm install --global pnpm@11.26.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
